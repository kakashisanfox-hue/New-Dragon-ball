name: Validar RPG Maker MV
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar estrutura do jogo
        run: python tools/validate_mv.py
